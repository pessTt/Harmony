<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Amigos Call</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>🖥️ Amigos Call</h1>
      <p class="subtitle">Sala de compartilhamento de tela</p>

      <div class="avatar-picker">
        <div id="avatar-preview" class="avatar-preview">?</div>
        <button id="choose-avatar-btn" type="button" class="link-btn">Escolher foto de perfil</button>
        <input id="avatar-file-input" type="file" accept="image/*" class="hidden" />
      </div>

      <input id="username-input" type="text" placeholder="Seu nome" maxlength="20" />
      <input id="room-input" type="text" placeholder="Nome da sala (ex: turma-facul)" maxlength="30" />

      <button id="join-btn">Entrar na sala</button>
      <p id="login-error" class="error"></p>
      <button id="toggle-advanced-btn" type="button" class="link-btn">Configurações avançadas</button>
      <div id="advanced-settings" class="hidden">
        <label class="small-label">Endereço do servidor</label>
        <input id="server-input" type="text" placeholder="https://..." />
      </div>
    </div>
  </div>

  <!-- TELA PRINCIPAL DO APP -->
  <div id="app-screen" class="screen hidden">
    <div class="sidebar">
      <div class="room-info">
        <h2 id="room-name-label">#sala</h2>
      </div>
      <div class="members-list">
        <h3>Na sala</h3>
        <ul id="members-ul"></ul>
      </div>
      <div class="controls">
        <button id="toggle-screen-btn" class="control-btn wide" title="Compartilhar tela">
          <svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Compartilhar tela</span>
        </button>
        <button id="leave-btn" class="control-btn leave" title="Sair">
          <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="m5 16 3.5-1.2a1.5 1.5 0 0 1 1.7.6l1 1.6a11.4 11.4 0 0 0 4.7-4.7l-1.6-1a1.5 1.5 0 0 1-.6-1.7L15 6l-1-3a15.7 15.7 0 0 0-9 9l1 4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" transform="rotate(135 12 12)"/></svg>
        </button>
      </div>
    </div>

    <div class="main-area">
      <div id="videos-grid" class="videos-grid"></div>

      <div class="chat-panel">
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" placeholder="Enviar mensagem..." autocomplete="off" />
          <button type="submit">
            <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 12 20 4l-6 16-3-7-7-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL PARA ESCOLHER QUAL TELA/JANELA COMPARTILHAR -->
  <div id="screen-picker-modal" class="modal hidden">
    <div class="modal-box">
      <h3>Escolha o que compartilhar</h3>
      <p class="modal-hint">💡 Para transmitir o áudio do jogo/vídeo junto, escolha uma <strong>Tela</strong> inteira (não uma janela específica) — é uma limitação do Windows/Mac, não do app.</p>
      <div id="screen-sources-grid" class="screen-sources-grid"></div>
      <button id="cancel-screen-share">Cancelar</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
